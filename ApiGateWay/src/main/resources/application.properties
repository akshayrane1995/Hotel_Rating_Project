spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://user-service:8082
spring.cloud.gateway.server.webflux.routes[0].predicates=Path=/user/**
spring.cloud.gateway.server.webflux.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.name=userServiceCB
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.fallbackUri=forward:/fallback/user

spring.cloud.gateway.server.webflux.routes[1].id=hotel-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://hotel-service:8080
spring.cloud.gateway.server.webflux.routes[1].predicates=Path=/hotel/**
spring.cloud.gateway.server.webflux.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.name=hotelServiceCB
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.fallbackUri=forward:/fallback/hotel

spring.cloud.gateway.server.webflux.routes[2].id=rating-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://rating-service:8081
spring.cloud.gateway.server.webflux.routes[2].predicates=Path=/rating/**
spring.cloud.gateway.server.webflux.routes[2].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[2].filters[0].args.name=ratingServiceCB
spring.cloud.gateway.server.webflux.routes[2].filters[0].args.fallbackUri=forward:/fallback/rating

spring.cloud.gateway.server.webflux.routes[3].id=user-auth-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://user-service:8082
spring.cloud.gateway.server.webflux.routes[3].predicates=Path=/auth/**
spring.cloud.gateway.server.webflux.routes[3].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[3].filters[0].args.name=userServiceCB
spring.cloud.gateway.server.webflux.routes[3].filters[0].args.fallbackUri=forward:/fallback/user

# Resilience4j Circuit Breaker config
resilience4j.circuitbreaker.instances.hotelServiceCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.hotelServiceCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.hotelServiceCB.wait-duration-in-open-state=5s

resilience4j.circuitbreaker.instances.userServiceCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.userServiceCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.userServiceCB.wait-duration-in-open-state=5s

resilience4j.circuitbreaker.instances.ratingServiceCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.ratingServiceCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.ratingServiceCB.wait-duration-in-open-state=5s