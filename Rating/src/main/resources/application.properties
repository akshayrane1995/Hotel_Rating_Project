spring.application.name=Rating

# Server port
server.port=8081

# MySQL Database Configuration
#spring.datasource.url=jdbc:mysql://localhost:3306/rating?createDatabaseIfNotExist=true
spring.datasource.url=jdbc:mysql://host.docker.internal:3306/rating?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform = org.hibernate.dialect.MySQLDialect

# noinspection SpringBootApplicationProperties
#hotel.service.url=http://localhost:8080
#user.service.url=http://localhost:8082
hotel.service.url=http://hotel-service:8080
user.service.url=http://user-service:8082

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.hotelService.sliding-window-size=5
resilience4j.circuitbreaker.instances.hotelService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.hotelService.wait-duration-in-open-state=10s

resilience4j.circuitbreaker.instances.userService.sliding-window-size=5
resilience4j.circuitbreaker.instances.userService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.userService.wait-duration-in-open-state=10s

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Resilience4j health indicator
management.health.circuitbreakers.enabled=true